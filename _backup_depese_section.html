<!-- Backed up from index.html — Depeše section, removed on request. Re-insert after the O meni block, before MREŽE, if brought back. -->
<div style="padding:44px 40px;border-top:2px dashed oklch(9% 0 0);">
<div style="font-family:'Anton',sans-serif;font-size:clamp(22px,4vw,30px);text-transform:uppercase;margin-bottom:6px;">Depeše</div>
<div style="font-family:'PT Serif',serif;font-style:italic;font-size:14px;opacity:0.6;margin-bottom:22px;">Depeše, bilješke i usputne objave.</div>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;">
<sc-for list="{{ posts }}" as="d" hint-placeholder-count="6">
<div style="display:flex;flex-direction:column;gap:10px;padding:18px;border:2px dashed oklch(9% 0 0 / 0.55);background:oklch(99% 0.002 90);box-shadow:4px 4px 0 oklch(9% 0 0 / 0.12);transform:rotate({{ d.rot }}deg);">
<div style="display:flex;flex-direction:column;gap:8px;">
<div style="font-family:'Space Mono',monospace;font-size:10.5px;font-weight:700;opacity:0.6;letter-spacing:0.02em;">[ {{ d.date }} ] {{ d.tag }}</div>
<div style="font-family:'Anton',sans-serif;font-size:24px;text-transform:uppercase;letter-spacing:0.01em;">{{ d.title }}</div>
</div>
<p style="margin:0;font-size:15px;line-height:1.55;">{{ d.text }}</p>
<a href="{{ d.link }}" target="_blank" rel="noopener" style="align-self:flex-start;font-family:'Space Mono',monospace;font-weight:700;font-size:12px;letter-spacing:0.04em;text-transform:uppercase;text-decoration:none;color:{{ accentColor }};text-shadow:0 0 5px,0 0 14px;animation:{{ linkFlashAnim }};">{{ d.linkLabel }} »</a>
</div>
</sc-for>
</div>
</div>
